{#include base.html}
{#title}Login{/title}
{#body}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-zinc-200 rounded-sm shadow-sm">
        <div class="px-8 pt-8 pb-6">
            <h1 class="text-lg font-semibold tracking-tight">Login</h1>
            <p class="mt-1 text-sm text-zinc-600">Enter your credentials to access your library.</p>
        </div>

        {#if error}
        <div class="mx-8 mb-6 border border-zinc-900 bg-zinc-900 text-white text-sm px-3 py-2 rounded-sm">
            {error}
        </div>
        {/if}
        {#if message}
        <div class="mx-8 mb-6 border border-zinc-200 bg-zinc-50 text-zinc-700 text-sm px-3 py-2 rounded-sm">
            {message}
        </div>
        {/if}

        <form method="post" action="/api/login" class="px-8 pb-8 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-zinc-700">Email</label>
                <input id="email" name="email" type="email" required autocomplete="email" value="{email ?: ''}"
                       placeholder="you@example.com"
                       class="mt-1 block w-full border border-zinc-300 rounded-sm px-3 py-2 text-sm bg-white placeholder:text-zinc-400 focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
            </div>
            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm font-medium text-zinc-700">Password</label>
                    <span class="text-xs font-mono text-zinc-500">min 8</span>
                </div>
                <input id="password" name="password" type="password" required autocomplete="current-password"
                       class="mt-1 block w-full border border-zinc-300 rounded-sm px-3 py-2 text-sm bg-white focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-zinc-900 text-white border border-zinc-900 rounded-sm px-4 py-2 text-sm font-medium hover:bg-zinc-800 focus:outline-none focus:ring-1 focus:ring-zinc-900">Login</button>
        </form>

        <div class="px-8 py-4 border-t border-zinc-200 bg-zinc-50 rounded-b-sm flex items-center justify-between">
            <p class="text-sm text-zinc-600">No account? <a href="/register" class="font-medium text-zinc-900 underline hover:no-underline">Register</a></p>
            <a href="/verification-sent" class="text-xs font-mono text-zinc-500 hover:text-zinc-700 underline">Resend verification</a>
        </div>
    </div>
</div>
{/include}
