# --- HTTP ---
quarkus.http.port=8080

# --- Datasource / DevServices vs Docker Compose ---
# Default (test): DevServices random port, no host dependency
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mediashelf
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.db-name=mediashelf
quarkus.datasource.username=mediashelf
quarkus.datasource.password=mediashelf
# Dev profile: use persistent postgres from docker-compose.yml (data survives restarts)
# Run: docker compose up -d  (creates mediashelf_postgres_data volume)
# Uses host.docker.internal so it works both on host and inside devcontainer (docker-outside-of-docker)
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://host.docker.internal:5432/mediashelf
%dev.quarkus.datasource.username=mediashelf
%dev.quarkus.datasource.password=mediashelf
%dev.quarkus.datasource.db-kind=postgresql

# --- Hibernate ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- JWT (SmallRye) ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=mediashelf
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=mediashelf
smallrye.jwt.new-token.lifespan=3600
smallrye.jwt.new-token.audience=mediashelf

# --- Mailer (dev: Mailpit, log fallback) ---
quarkus.mailer.from=noreply@mediashelf.local
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.mock=false
quarkus.mailer.start-tls=DISABLED
# In dev, Mailpit Dev Service would be ideal; fallback logs verification link
%dev,quarkus.mailer.mock=false
%test,quarkus.mailer.mock=true

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.info-title=Personal Media Tracker API
quarkus.smallrye-openapi.info-version=0.2.0
quarkus.smallrye-openapi.info-description=REST API for Personal Media Tracker - phase 1 auth + Qute pages
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.operations-sorter=method
mp.openapi.scan.disable=false

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."org.hlopes".level=DEBUG

# --- Verification token config ---
mediashelf.verification.token-expiry-hours=24
mediashelf.verification.base-url=http://localhost:8080
mediashelf.jwt.issuer=${mp.jwt.verify.issuer}
mediashelf.jwt.lifespan=${smallrye.jwt.new-token.lifespan}

# --- TMDB Catalog ---
mediashelf.tmdb.api-key=${TMDB_API_KEY:}
mediashelf.tmdb.base-url=https://api.themoviedb.org/3
mediashelf.tmdb.image-base-url=https://image.tmdb.org/t/p
mediashelf.tmdb.timeout=3S
%prod.mediashelf.tmdb.api-key=${TMDB_API_KEY:}
quarkus.rest-client.tmdb.url=${mediashelf.tmdb.base-url}
quarkus.rest-client.tmdb.scope=jakarta.inject.Singleton
quarkus.rest-client.tmdb.connect-timeout=${mediashelf.tmdb.timeout}
quarkus.rest-client.tmdb.read-timeout=${mediashelf.tmdb.timeout}
quarkus.cache.caffeine.catalog-search.maximum-size=200
quarkus.cache.caffeine.catalog-search.expire-after-write=10M
quarkus.cache.caffeine.catalog-detail.maximum-size=500
quarkus.cache.caffeine.catalog-detail.expire-after-write=24H
