services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediashelf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mediashelf
      POSTGRES_PASSWORD: mediashelf
      POSTGRES_DB: mediashelf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediashelf -d mediashelf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local
    name: mediashelf_postgres_data
