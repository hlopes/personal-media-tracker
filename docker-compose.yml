services:
  postgres:
    image: postgres:16-alpine
    container_name: mediashelf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mediashelf
      POSTGRES_PASSWORD: mediashelf
      POSTGRES_DB: mediashelf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediashelf -d mediashelf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  wikipedia-mcp-server:
    image: ghcr.io/cyanheads/wikipedia-mcp-server:latest
    container_name: mediashelf-wikipedia-mcp
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      MCP_TRANSPORT_TYPE: http
      MCP_HTTP_PORT: 3010
      MCP_LOG_LEVEL: info
      WIKIPEDIA_USER_AGENT: mediashelf-wikipedia-mcp/1.0 (https://github.com/hlopes/personal-media-tracker)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/mcp || wget -qO- http://localhost:3010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    driver: local
    name: mediashelf_postgres_data
